# HaLow gateway firewall/NAT. Loaded by halow-net.service (idempotent:
# the table is flushed and rebuilt atomically on each load).
table ip halow
delete table ip halow
table ip halow {
  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    # HaLow net out to the LAN/upstream (and onward via eth0 NAT)
    iifname "halow0" accept
    # LAN reaching into the HaLow net (nodes are first-class citizens)
    iifname "eth0" oifname "halow0" accept
    # Onboard WiFi clients (if wlan0 AP is enabled) reach both sides
    iifname "wlan0" accept
  }
  chain prerouting {
    type nat hook prerouting priority dstnat; policy accept;
    # Router console on the standard HTTPS port: https://<any gateway addr>
    # lands on the unprivileged UI listener at :8443 (no root, no extra caps).
    tcp dport 443 redirect to :8443
  }
  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    # Masquerade HaLow/WiFi-client traffic toward the wired LAN.
    # LAN -> HaLow is routed (not NAT'd); add a route to 10.117.0.0/24
    # via 192.168.51.202 on the LAN router for full two-way visibility.
    ip saddr 10.117.0.0/24 oifname "eth0" masquerade
  }
}
