# /etc/dnsmasq.d/halow.conf — DHCP+DNS for the HaLow subnet only.
# Binds to the HaLow interface; never answers on eth0 (the LAN has its own).
interface=halow0
# bind-dynamic: halow0 appears only after the morse driver probes the chip;
# a static bind at boot would fail and take dnsmasq down with it.
bind-dynamic
dhcp-range=10.117.0.10,10.117.0.200,12h
dhcp-option=option:router,10.117.0.1
dhcp-option=option:dns-server,1.1.1.1,8.8.8.8
dhcp-option=option:ntp-server,10.117.0.1
dhcp-authoritative
# Join forensics (halow-join-log): per-option DHCP detail names which step
# of an incomplete exchange died. Also emitted by the halowctl dhcp-config
# heredoc — the two templates must stay in sync.
log-dhcp
