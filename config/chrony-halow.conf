# /etc/chrony/conf.d/halow.conf — serve NTP to the gateway's own networks.
# HaLow nodes without GPS lock need a time source for log correlation and
# time-based housekeeping (the bench skips pruning while the clock is unset).
allow 10.117.0.0/24
allow 10.42.0.0/24
# Holdover: without this, an unsynchronized chronyd (field power-cycle with
# the upstream down; verified: stratum 0, client gets "Timeout reached")
# refuses the RTC-less clients exactly when they need it. Serve our own
# clock at stratum 10 — approximately right thanks to driftfile (Debian
# base) + fake-hwclock, and any client that can also see a real source
# prefers the lower stratum. No 'orphan': that exists to break loops
# between multiple local-capable servers; this subnet has exactly one.
local stratum 10
