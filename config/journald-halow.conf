# /etc/systemd/journald.conf.d/halow.conf — bound journal disk use.
# The raised hostapd logger level + dnsmasq log-dhcp (join forensics,
# roadmap 16) write at real cadence once stations exist; without a cap
# the journal grows until the SD is full. 100M leaves forensics headroom.
[Journal]
SystemMaxUse=100M
RuntimeMaxUse=32M
