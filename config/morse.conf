# /etc/modprobe.d/morse.conf
# Heltec HT-HC01P (Morse Micro MM6108): board calibration file + regulatory
# domain + the SPI timing that first contact was achieved with (2026-08-05):
#  - 4 MHz clock: 50 MHz never answered over hand wiring; CMD53 bulk writes
#    corrupted at boot-time 50 MHz even after init passed.
#  - 64-byte ack windows: the chip acks writes to some registers (0x40xx
#    clock/PLL block) later than the driver's default 4-byte scan window;
#    identical failure at 1 and 4 MHz proved it structural, not analog.
options morse bcf=bcf_mf08551.bin country=US spi_clock_speed=4000000 spi_post_write_status_bytes=64 spi_inter_block_delay_bytes=64
